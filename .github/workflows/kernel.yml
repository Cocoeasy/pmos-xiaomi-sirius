# Full linux-postmarketos-qcom-sdm670 with the sirius dtb injected,
# then a boot.img. Hours + large disk. Manual by default.
name: kernel

on:
  workflow_dispatch:

concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free disk
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 1024
          swap-size-mb: 8192
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - uses: actions/checkout@v5

      - name: Point default pmbootstrap work at the big disk
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.pmbootstrap" "$HOME/.local/var"
          ln -sfn "$GITHUB_WORKSPACE/.pmbootstrap" "$HOME/.local/var/pmbootstrap"

      - name: Install pmbootstrap from git
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 openssl
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          mkdir -p "$HOME/.local/bin"
          ln -s "$PWD/pmbootstrap/pmbootstrap.py" "$HOME/.local/bin/pmbootstrap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/pmbootstrap" --version

      - name: Init pmaports (edge)
        run: |
          yes "" | pmbootstrap init --shallow-initial-clone || true
          pmbootstrap config ui none
          pmbootstrap config device xiaomi-pyxis
          test -d "$HOME/.local/var/pmbootstrap/cache_git/pmaports/device"

      - name: Inject sirius dts and build kernel
        run: |
          chmod +x scripts/sync-overlay.sh scripts/inject-sirius-dts.sh
          ./scripts/sync-overlay.sh
          ./scripts/inject-sirius-dts.sh
          pmbootstrap checksum linux-postmarketos-qcom-sdm670
          pmbootstrap build --force linux-postmarketos-qcom-sdm670

      - name: Extract sirius dtb from apk
        run: |
          mkdir -p .work/kernel-apk
          find "$HOME/.local/var/pmbootstrap/packages" -type f | sort
          apk=$(find "$HOME/.local/var/pmbootstrap/packages" -name 'linux-postmarketos-qcom-sdm670-*.apk' | head -n1)
          if [ -z "$apk" ]; then
            echo "local kernel apk missing; build was skipped or wrote elsewhere" >&2
            exit 1
          fi
          cp "$apk" .work/kernel-apk/
          tar -tzf "$apk" | grep sdm710-xiaomi-sirius.dtb
          tar -xzf "$apk" -C .work/kernel-apk --wildcards '*sdm710-xiaomi-sirius.dtb'
          printf '%s\n' \
            'This is the kernel Alpine package, not a boot image.' \
            'Flash the sirius-boot-img artifact, not this apk.' \
            > .work/kernel-apk/DO_NOT_FLASH.txt

      - name: Upload kernel apk
        uses: actions/upload-artifact@v5
        with:
          name: linux-postmarketos-qcom-sdm670-sirius
          path: .work/kernel-apk
          if-no-files-found: error
          retention-days: 14

      - name: Build device package and boot image
        run: |
          set -eux
          pmbootstrap config device xiaomi-sirius
          pmbootstrap config ui none
          pmbootstrap checksum device-xiaomi-sirius
          pmbootstrap build device-xiaomi-sirius
          yes "" | pmbootstrap install --password 147147 --no-recommends
          mkdir -p .work/export .work/flash
          pmbootstrap export .work/export
          ls -la .work/export
          if [ ! -f .work/export/boot.img ]; then
            echo "pmbootstrap export did not write boot.img" >&2
            find .work/export -type f -ls || true
            exit 1
          fi
          cp -L .work/export/boot.img .work/flash/boot.img
          python3 - <<'PY'
          from pathlib import Path
          p = Path(".work/flash/boot.img")
          magic = p.read_bytes()[:8]
          size = p.stat().st_size
          print(f"boot.img size={size} magic={magic!r}")
          if magic != b"ANDROID!":
              raise SystemExit(f"boot.img magic is {magic!r}, expected ANDROID!")
          if size > 67108864:
              raise SystemExit("boot.img is larger than this phone's 64 MiB boot partition")
          PY
          printf '%s\n' \
            'Flash ONLY boot.img onto the boot partition.' \
            '  fastboot flash boot boot.img' \
            'Do not flash userdata, super, system, vendor, recovery, or dtbo.' \
            'Rollback: fastboot flash boot <android-boot-backup>/boot.img' \
            'This public artifact uses password 147147 (postmarketOS demo).' \
            'After ~30s the PC should see a Remote NDIS adapter.' \
            'Phone address is 172.16.42.1 (initramfs telnet).' \
            > .work/flash/FLASH.txt

      - name: Upload boot image
        uses: actions/upload-artifact@v5
        with:
          name: sirius-boot-img
          path: |
            .work/flash/boot.img
            .work/flash/FLASH.txt
          if-no-files-found: error
          retention-days: 14
